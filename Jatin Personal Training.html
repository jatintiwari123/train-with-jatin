 `<div class="row" style="margin-bottom:12px"><button class="b" data-a="newcl">Add client</button><button class="b g" data-a="go" data-v="wk">Start session</button><button class="b g" data-a="go" data-v="prog">Create workout</button><button class="b g" data-a="go" data-v="pg">View progress</button></div>

newex:()=>exForm({}),editex:d=>exForm(S.ex.find(e=>e.id===d.i)),tgl(d){ui.open=ui.open===d.i?null:d.i;$('#lst').innerHTML=exList()},
dupex(d){const e=S.ex.find(x=>x.id===d.i);S.ex.push({...e,id:uid(),name:e.name+' (copy)'});save();toast('Duplicated');$('#lst').innerHTML=exList()},arcex(d){S.ex.find(x=>x.id===d.i).arch=1;save();toast('Archived');$('#lst').innerHTML=exList()},
newprog(){const p={id:uid(),name:'New template',split:'Custom',clientId:null,days:[{name:'Day 1',ex:[]}],start:'',end:''};S.progs.push(p);save();go('pe',p.id)},editprog:d=>go('pe',d.i),
dupprog(d){const p=JSON.parse(JSON.stringify(PG(d.i)));p.id=uid();p.name+=' (copy)';S.progs.push(p);save();render()},delprog(d){if(confirm('Delete this program? Past workout history is kept.')){S.progs=S.progs.filter(p=>p.id!==d.i);S.clients.forEach(c=>{if(c.progId===d.i)c.progId=null});save();render()}},
assign(d){modal(`<h2>Assign to clients</h2><div class="mu">Each client gets their own editable copy.</div><form data-s="assign" data-i="${d.i}">${S.clients.map(c=>`<label style="color:var(--tx)"><input type="checkbox" name="${c.id}" style="width:auto"> ${esc(c.name)}</label>`).join('')}${sub()}</form>`)},
addday(){const P=PG(arg);P.days.push({name:'Day '+(P.days.length+1),ex:[]});save();render()},rmday(d){PG(arg).days.splice(d.d,1);save();render()},cpday(d){const P=PG(arg),c=JSON.parse(JSON.stringify(P.days[d.d]));c.name+=' (copy)';P.days.push(c);save();render()},
adpx(d){PG(arg).days[d.d].ex.push({id:$('#ax'+d.d).value,sets:3,reps:'8-12',w:0,rest:S.set.rest,rpe:'',note:'',typ:'',wu:0});save();render()},rmpx(d){PG(arg).days[d.d].ex.splice(d.e,1);save();render()},
mvex(d){const l=PG(arg).days[d.d].ex,i=+d.e,j=i+ +d.n;if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];save();render()},
newap(){modal(`<h2>Schedule session</h2><form data-s="ap">${sel('Client','c',[''],'').replace(/<option[^>]*><\/option>/,S.clients.filter(c=>c.status==='active').map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(''))}${inp('Date','date',td(),'date','required')}${inp('Time','time','07:00','time','required')}${inp('Note','note','')}${sub()}</form>`)},
wo(d){ui.wo=(ui.wo||0)+ +d.n;render()},delap(d){S.appts=S.appts.filter(a=>a.id!==d.i);save();render()},fromAppt(d){const a=S.appts.find(x=>x.id===d.i);ui.wc=a.clientId;go('wk')},
newms(d){modal(`<h2>Add measurements</h2><form data-s="ms" data-i="${d.i}">${inp('Date','date',td(),'date','required')}<div class="grid">${[['Weight kg','weight'],['Waist cm','waist'],['Chest cm','chest'],['Hip cm','hip'],['Arm cm','arm'],['Thigh cm','thigh'],['Body fat %','bf']].map(q=>inp(q[0],q[1],'','number','step="0.1"')).join('')}</div>${sub()}</form>`)},
pgc(d){ui.pc=d.i;go('pg')},
csv(d){const r=['date,program,day,exercise,set,type,kg,reps'];S.sessions.filter(s=>s.clientId===d.i).forEach(s=>s.ex.forEach(x=>x.sets.forEach((q,i)=>r.push([s.date,s.progName,s.dayName,EXO(x.id).name,i+1,q.t,q.w,q.r].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')))));modal(`<h2>CSV export</h2><div class="mu">Copy this into a spreadsheet.</div><textarea rows="10" readonly onfocus="this.select()">${esc(r.join('\n'))}</textarea><button class="b g" style="margin-top:10px" data-a="close">Close</button>`)},
backup(){modal(`<h2>Backup and restore</h2><label>Copy this to back up</label><textarea rows="5" readonly onfocus="this.select()">${esc(JSON.stringify(S))}</textarea><label>Paste a backup to restore (replaces current data)</label><textarea id="rs" rows="4"></textarea><div class="row" style="margin-top:10px"><button class="b" data-a="restore">Restore</button><button class="b g" data-a="close">Close</button></div>`)},
restore(){try{const j=JSON.parse($('#rs').value);if(!j.clients||!j.ex||!j.sessions)throw 0;S=j;S.pay=S.pay||[];S.set.cur=S.set.cur||'₹';save();theme();closeM();render();toast('Restored')}catch(e){toast('That backup is not valid')}},
reset(){if(confirm('Replace all data with demo data? This cannot be undone.')){S=seed();save();theme();render()}}};
function clForm(c){modal(`<h2>${c.id?'Edit client':'New client'}</h2><form data-s="cl" data-i="${c.id||''}">${inp('Full name','name',c.name,'text','required')}<div class="grid">${inp('Age','age',c.age,'number')}${inp('Height cm','height',c.height,'number')}${inp('Weight kg','weight',c.weight,'number','step="0.1"')}${inp('Days per week','freq',c.freq,'number')}</div>${inp('Contact','contact',c.contact)}${sel('Goal','goal',GOALS,c.goal)}${sel('Experience','exp',['Beginner','Intermediate','Advanced'],c.exp)}${sel('Status','status',['active','paused','inactive'],c.status)}<label>Injuries and restrictions</label><textarea name="injuries" rows="2">${esc(c.injuries)}</textarea>${sel('Fee type','ftype',FT,(c.fee||{}).type)}<div class="grid">${inp('Fee amount','famt',(c.fee||{}).amt,'number')}${inp('Due day of month','fdue',(c.fee||{}).due||1,'number','min="1" max="28"')}${inp('Sessions per package','fsize',(c.fee||{}).size||12,'number')}</div>${sub()}</form>`)}
function exForm(e){modal(`<h2>${e.id?'Edit exercise':'New exercise'}</h2><form data-s="ex" data-i="${e.id||''}">${inp('Name','name',e.name,'text','required')}${inp('Alternative names','alt',e.alt)}${sel('Target muscle','muscle',MUS,e.muscle)}${inp('Secondary muscles','sec',e.sec)}${inp('Equipment','equip',e.equip)}${sel('Difficulty','diff',['Beginner','Intermediate','Advanced'],e.diff)}<label>Instructions</label><textarea name="ins" rows="3">${esc(e.ins)}</textarea>${inp('Form and safety tips','tips',e.tips)}${inp('Common mistakes','mist',e.mist)}${inp('Substitutions','subs',e.subs)}${inp('Video link','vid',e.vid,'url')}${sub()}</form>`)}
const SB={
pay(f,fm){S.pay.push({id:uid(),clientId:fm.dataset.i,...f});save();closeM();toast('Payment recorded');render()},
cl(f,fm){const c=C(fm.dataset.i)||{id:uid(),notes:[],progId:null};const{ftype,famt,fdue,fsize,...r}=f;Object.assign(c,r);c.fee={type:ftype,amt:famt,due:fdue,size:fsize};if(!C(c.id))S.clients.push(c);save();closeM();go('cl',c.id)},
ex(f,fm){const e=S.ex.find(x=>x.id===fm.dataset.i);if(e)Object.assign(e,f);else S.ex.push({...f,id:uid(),cat:f.muscle==='Cardio'?'Cardio':'Strength',arch:0});save();closeM();toast('Saved');if(view==='lib')$('#lst').innerHTML=exList()},
ap(f){S.appts.push({id:uid(),status:'scheduled',...f});save();closeM();render()},
ms(f,fm){S.measures.push({id:uid(),clientId:fm.dataset.i,...f});save();closeM();render()},
assign(f,fm){const p=PG(fm.dataset.i);Object.keys(f).forEach(cid=>{const c=JSON.parse(JSON.stringify(p));c.id=uid();c.clientId=cid;S.progs.push(c);C(cid).progId=c.id});save();closeM();toast('Assigned');render()}};
const IN={q:t=>{ui.q=t.value;$('#lst').innerHTML=view==='lib'?exList():clList()},st:t=>{ui.st=t.value;$('#lst').innerHTML=clList()},gl:t=>{ui.gl=t.value;$('#lst').innerHTML=clList()},mu:t=>{ui.mu=t.value;$('#lst').innerHTML=exList()},
setprog:t=>{C(t.dataset.i).progId=t.value||null;save();render()},wc:t=>{ui.wc=t.value;render()},pc:t=>{ui.pc=t.value;render()},pe:t=>{ui.pe=t.value;render()},
apst:t=>{S.appts.find(a=>a.id===t.dataset.i).status=t.value;save();render()},
ws:t=>{const d=t.dataset,q=S.draft.ex[d.e].sets[d.s];q[d.f]=t.value;save()},wn:t=>{S.draft.ex[t.dataset.e].n=t.value;save()},
brand:t=>{S.set.brand=t.value;save()},cur:t=>{S.set.cur=t.value||'₹';save()},rest:t=>{S.set.rest=+t.value||90;save()},theme:t=>{S.set.theme=t.value;theme();save()}};
document.addEventListener('click',e=>{if(e.target.id==='md')return closeM();const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset,t)});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.in;if(!k)return;if(k==='pe'&&t.dataset.f){const P=PG(arg),d=t.dataset;(d.d===undefined?P:d.e===undefined?P.days[d.d]:P.days[d.d].ex[d.e])[d.f]=t.value;save()}else if(IN[k])IN[k](t)});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;SB[f.dataset.s](Object.fromEntries(new FormData(f)),f)});
load();if(S.draft)view='wk';render();
</script></body></html>
